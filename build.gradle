plugins {
    id 'fabric-loom' version '1.9.2'
    id 'maven-publish'
}


group = 'com.example.respawnprotection'
version = '1.0.2'

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.4"
    mappings "net.fabricmc:yarn:1.21.4+build.1:v2" // (example mapping - adjust if needed)
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.119.2+1.21.4"
    modImplementation "net.fabricmc:fabric-loader:0.16.4" // Match to a modern loader
}

loom {
    splitEnvironmentSourceSets()
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}
